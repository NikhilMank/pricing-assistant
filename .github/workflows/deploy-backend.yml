name: Deploy backend

# Runs when backend code, the data or this workflow changes on main, or by hand.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "data/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Safety check before anything is deployed (offline fake model, same as locally)
      - name: Agent evals
        working-directory: backend
        env:
          LLM_PROVIDER: fake
        run: |
          pip install -r requirements.txt
          python -W ignore evals.py

      - name: Build Lambda zip
        working-directory: backend
        run: python build_lambda.py

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Lambda
        run: |
          aws s3 cp build/lambda.zip "s3://${{ secrets.BACKEND_BUCKET_NAME }}/lambda.zip"
          aws lambda update-function-code --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --s3-bucket "${{ secrets.BACKEND_BUCKET_NAME }}" --s3-key lambda.zip > /dev/null
          aws lambda wait function-updated --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}"

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 "${{ secrets.VITE_API_URL }}/api/health"
