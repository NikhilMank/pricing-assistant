name: Deploy to Cloud Run

# Runs when the app code, the data, the Dockerfile or this workflow changes on main, or by hand.
# Runs the offline evals first, then: build the image, push it to Artifact Registry, update the service.
# Signs in to Google without a key (Workload Identity Federation, set up by terraform/gcp).
#
# One-time setup: add three repository variables (Settings > Secrets and variables > Actions > Variables):
#   GCP_PROJECT_ID   the Google Cloud project id
#   GCP_WIF_PROVIDER terraform output github_wif_provider
#   GCP_DEPLOY_SA    terraform output github_deploy_service_account
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/**"
      - "Dockerfile"
      - ".github/workflows/deploy-cloudrun.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job ask GitHub for the short-lived token Google checks

concurrency: deploy-cloudrun

env:
  REGION: europe-west3
  SERVICE: pricing-assistant

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Safety check before anything is deployed (offline fake model, same as locally).
      # statsmodels is installed here too, so the Custom recalculation checks run as well.
      - name: Agent evals
        working-directory: backend
        env:
          LLM_PROVIDER: fake
        run: |
          pip install -r requirements.txt
          python -W ignore evals.py

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/pricing-assistant/app:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      # Only the image changes: variables, service account and limits stay as Terraform set them
      - name: Update the Cloud Run service
        run: |
          gcloud run services update "${SERVICE}" \
            --image "${IMAGE}" --region "${REGION}" --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${{ vars.GCP_PROJECT_ID }}" --format='value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 "${URL}/api/health"
